<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 13</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>CALCULADORA BASICA</h1>

    <div class="row">
        <div id="pantalla" class="col-12 pantalla"></div>
    </div>

    <div class="row">
        <button type="button" class="col-3 boton ce">ce</button>
        <button type="button" class="col-3 boton c">c</button>
        <button type="button" class="col-3 boton operacion">±</button>
        <button type="button" class="col-3 boton operacion">%</button>
    </div>

    <div class="row">
        <button type="button" class="col-3 boton numero">7</button>
        <button type="button" class="col-3 boton numero">8</button>
        <button type="button" class="col-3 boton numero">9</button>
        <button type="button" class="col-3 boton operacion">/</button>
    </div>

    <div class="row">
        <button type="button" class="col-3 boton numero">4</button>
        <button type="button" class="col-3 boton numero">5</button>
        <button type="button" class="col-3 boton numero">6</button>
        <button type="button" class="col-3 boton operacion">x</button>
    </div>

    <div class="row">
        <button type="button" class="col-3 boton numero">1</button>
        <button type="button" class="col-3 boton numero">2</button>
        <button type="button" class="col-3 boton numero">3</button>
        <button type="button" class="col-3 boton operacion">-</button>
    </div>

    <div class="row">
        <button type="button" class="col-3 boton numero">0</button>
        <button type="button" class="col-3 boton numero">.</button>
        <button type="button" class="col-3 boton igual">=</button>
        <button type="button" class="col-3 boton operacion">+</button>
    </div>

    <script>

        let pantalla = document.getElementById("pantalla");
        let numeros = document.querySelectorAll(".numero");
        let operadores = document.querySelectorAll(".operacion");
        let igual = document.querySelector(".igual");
        let c = document.querySelector(".c");
        let ce = document.querySelector(".ce");

        let val1 = null;
        let val2 = null;
        let operador = null;
        let resultado = null;


        numeros.forEach(function (boton) {
            boton.addEventListener("click", function () {
                pantalla.textContent += boton.textContent;

            });
        });


        operadores.forEach(function (boton) {
            boton.addEventListener("click", function () {
                pantalla.textContent += " " + boton.textContent + " ";
            });
        });


        igual.addEventListener("click", function () {

            let partes = pantalla.textContent.split(" ");

            val1 = Number(partes[0]);
            operador=partes[1];
            val2 = Number(partes[2]);


            switch (operador) {

                case "+":
                    resultado = val1 + val2;
                    break;

                case "-":
                    resultado = val1 - val2;
                    break;

                case "x":
                    resultado = val1 * val2;
                    break;

                case "/":

                    if (val2 != 0) {
                        resultado = val1 / val2;
                    } else {
                        resultado = "error";
                    }

                    break;
            }

            pantalla.textContent = resultado;

        });


        c.addEventListener("click", function () {
            pantalla.textContent = "";
            val1 = null;
            val2 = null;
            operador = null;
            resultado = null;
        });

        ce.addEventListener("click", function () {
            pantalla.textContent = pantalla.textContent.slice(0, -1);
        });

    </script>

</body>

</html>
