<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 13</title>
    <link href="materialize/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        #calc .btn-floating {
            width: 86px;
            height: 86px;
        }

        #calc .btn-floating i {
            line-height: 86px;
            font-size: 2.2rem;
        }

        #calc .btn-floating.numero {
            line-height: 86px;
            font-size: 1.9rem;
        }

        #pantalla {
            height: 86px;
            line-height: 56px;
            overflow: hidden;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div class="container" id="calc" style="max-width:430px;">

        <h1 class="center">CALCULADORA BASICA</h1>

        <div class="row">
            <div id="pantalla" class="col s12 card-panel black white-text right-align z-depth-3"
                style="font-size:2rem; padding:15px;"></div>
        </div>

        <div class="row">
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light orange ce"><i class="material-icons">backspace</i></a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light orange c"><i class="material-icons">clear</i></a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light red operacion"><i class="material-icons">exposure</i></a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light red operacion"><i class="material-icons">percent</i></a>
            </div>
        </div>

        <div class="row">
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light blue numero" >7</a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light blue numero" >8</a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light blue numero" >9</a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light red operacion"><i class="material-icons">divide</i></a>
            </div>
        </div>

        <div class="row">
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light blue numero" >4</a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light blue numero" >5</a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light blue numero" >6</a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light red operacion"><i class="material-icons">close</i></a>
            </div>
        </div>

        <div class="row">
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light blue numero" >1</a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light blue numero" >2</a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light blue numero" >3</a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light red operacion"><i class="material-icons">remove</i></a>
            </div>
        </div>

        <div class="row">
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light blue numero" >0</a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light blue numero" >.</a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light green igual"><i class="material-icons">equal</i></a>
            </div>
            <div class="col s3 center-align">
                <a href="#!" class="btn-floating btn-large waves-effect waves-light red operacion"><i class="material-icons">add</i></a>
            </div>
        </div>

    </div>

    <script src="materialize/materialize.min.js"></script>

    <script>

        let pantalla = document.getElementById("pantalla");
        let numeros = document.querySelectorAll(".numero");
        let operadores = document.querySelectorAll(".operacion");
        let igual = document.querySelector(".igual");
        let c = document.querySelector(".c");
        let ce = document.querySelector(".ce");

        let val1 = null;
        let val2 = null;
        let operador = null;
        let resultado = null;


        numeros.forEach(function (boton) {
            boton.addEventListener("click", function () {
                pantalla.textContent += boton.textContent;

            });
        });


        let simbolos = {
            add: "+",
            remove: "-",
            close: "x",
            divide: "/",
            percent: "%",
            exposure: "±"
        };

        operadores.forEach(function (boton) {
            boton.addEventListener("click", function () {
                let simbolo = simbolos[boton.textContent] || boton.textContent;
                pantalla.textContent += " " + simbolo + " ";
            });
        });


        igual.addEventListener("click", function () {

            let partes = pantalla.textContent.split(" ");

            val1 = Number(partes[0]);
            operador = partes[1];
            val2 = Number(partes[2]);


            switch (operador) {

                case "+":
                    resultado = val1 + val2;
                    break;

                case "-":
                    resultado = val1 - val2;
                    break;

                case "x":
                    resultado = val1 * val2;
                    break;

                case "%":
                    resultado = val1 % val2;
                    break;

                case "/":

                    if (val2 != 0) {
                        resultado = val1 / val2;
                    } else {
                        resultado = "error";
                    }

                    break;

                default:
                    resultado = "error";
            }

            pantalla.textContent = resultado;

        });


        c.addEventListener("click", function () {
            pantalla.textContent = "";
            val1 = null;
            val2 = null;
            operador = null;
            resultado = null;
        });

        ce.addEventListener("click", function () {
            pantalla.textContent = pantalla.textContent.slice(0, -1);
        });

    </script>

</body>

</html>
