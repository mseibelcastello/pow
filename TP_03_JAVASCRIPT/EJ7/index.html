<!DOCTYPE html>
<html lang="en">

<head>

<body>
    <div class="primerpag">
        <h1>Heladería</h1>
        <h2>Añade un producto:</h2>

        <label for="categoria>">Categoría:</label>
        <br>

        <select id="categoria" name="categoria">
            <option value="">Seleccione Categoría...</option>
            <option value="helados">Helados</option>
            <option value="postres">Postres</option>
            <option value="bebidas">Bebidas</option>
        </select>

        <h3>Sabores que ofrecemos</h3>

        <label for="sabor">Sabor:</label>
        <br>
        <input type="text" id="sabor">

        <br><br>

        <label for="sabor">Cantidad:</label>
        <br>
        <input type="text" id="cantidad">
        <br><br>

        <label>
            <input type="radio" name="cantidad"> Pequeño (2)
        </label>
        <label>
            <input type="radio" name="cantidad"> Mediano (5)
        </label>
        <label>
            <input type="radio" name="cantidad"> Grande (7)
        </label>

        <h3>Complementos</h3>

        <label>
            <input type="checkbox">
            Mani
        </label>
        <br>

        <label>
            <input type="checkbox">
            Chispas de chocolate
        </label>
        <br>

        <label>
            <input type="checkbox">
            Chispas de colores
        </label>
        <br>

        <label>
            <input type="checkbox">
            Leche condensada
        </label>
        <br>
        <br>

        <div class="boton positivo">
            <a href="segundapag.html" class="link_normal">Enviar</a>
        </div>
        <br>
        <div class="boton negativo">
            <a href="segundapag.html" class="link_normal">Borrar</a>
        </div>
