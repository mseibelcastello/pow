<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 14 </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>

        <h1>EVENTO: onMouseOver </h1>

        <img id="img1" src="gatito1.jpg" alt="gatito 1">



        <h1>EVENTO: onMouseOut </h1>

        <img id="img2" src="gatito2.avif" alt="gatito 2">

        <br><br><br>
        <h1>EVENTO: onClick </h1>
        <img id="img3" src="gatito3.jfif" alt="gatito 3">



    </div>

    <script>
        let img1 = document.getElementById("img1");
        let img2 = document.getElementById("img2");
        let img3 = document.getElementById("img3");

        img1.addEventListener("mouseover", function () {
            img1.style.transform = "scale(1.3)";
        })


        img2.addEventListener("mouseover", function () {
            img2.style.transform = "scale(1.3)";
        })
        img2.addEventListener("mouseout", function () {
            img2.style.transform = "scale(1)";
        })

        img3.addEventListener("click", function(){
            if(img3.src.includes("gatito3.jfif")){
                img3.src ="gatito4.avif";
            }  else{
                img3.src= "gatito3.jfif";
            }

            
        })


    </script>

</body>

</html>
