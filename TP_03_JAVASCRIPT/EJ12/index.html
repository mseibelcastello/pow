<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO 12</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Bitcount+Grid+Double+Ink:wght@100..900&family=Fredoka:wght@300..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: "Source Code Pro", monospace;
        }
    </style>
</head>

<body>
    <h1 id="hora"></h1>

    <script>

        function mostrarHora() {
            let hora;
            let minuto;
            let segundo;

            let fecha = new Date;

            document.getElementById("hora").textContent = fecha.getHours() + ":" + fecha.getMinutes() + ":" + fecha.getSeconds();
        }

        mostrarHora();


        setInterval(mostrarHora, 1000);

    </script>

</body>

</html>
