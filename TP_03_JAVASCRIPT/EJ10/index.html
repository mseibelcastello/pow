<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIO</title>
</head>

<body>

    <h1>ARREGLO INGRESADO</h1>
    <h2 id="arreglo"></h2>
    <h1>SUMA DEL ARREGLO</h1>
    <h2 id="suma"></h2>

    <script>

        let arr = [1, 2, 3, 4, 5];
        let res = 0;

        arr.forEach(function (numero) {
            document.getElementById("arreglo").textContent += numero + " ";
            res = suma(numero, res);
        })

        document.getElementById("suma").textContent = res;


        function suma(numero, res) {
            return res + numero

        }


    </script>

</body>

</html>
