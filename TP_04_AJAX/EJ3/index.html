<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECETARIO INTERACTIVO</title>
    <link rel="stylesheet" href="materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav>
        <div class="nav-wrapper">
            <a href="#" class="brand-logo"><i class="material-icons">restaurant_menu</i> Recetario interactivo</a>
        </div>
    </nav>

    <main class="container">

        <div class="card panel-buscar">
            <div class="card-content">
                <span class="card-title titulo-seccion"><i class="material-icons left">search</i> Buscar comida</span>

                <div class="row">
                    <div class="col s12 m7">
                        <div class="input-field">
                            <input id="buscador" type="text">
                            <label for="buscador">Nombre de la receta</label>
                        </div>
                    </div>
                    <div class="col s12 m5 btn-buscar">
                        <button class="btn waves-effect waves-light" onclick="buscar_nombre()">
                            <i class="material-icons left">search</i> Buscar
                        </button>
                    </div>
                </div>

                <div class="row filtros">
                    <div class="col s12 m4">
                        <div class="input-field">
                            <select id="categorias" onchange="buscar()">
                                <option value="" disabled selected>Seleccionar categoría</option>
                            </select>
                            <label>Filtrar por categoría</label>
                        </div>
                    </div>
                    <div class="col s12 m4">
                        <div class="input-field">
                            <select id="areas" onchange="buscar()">
                                <option value="" disabled selected>Seleccionar área</option>
                            </select>
                            <label>Filtrar por área</label>
                        </div>
                    </div>
                    <div class="col s12 m4">
                        <div class="input-field">
                            <select id="ingredientes" onchange="buscar()">
                                <option value="" disabled selected>Seleccionar ingrediente</option>
                            </select>
                            <label>Filtrar por ingrediente</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card panel-resultados">
            <div class="card-content">
                <span class="card-title titulo-seccion"><i class="material-icons left">grid_view</i> Resultados <span id="contador_resultados" class="contador-resultados"></span></span>
                <div id="estado"></div>
                <div id="resultados_buscar" class="row tarjetas"></div>
            </div>
        </div>

        <div class="card panel-detalle">
            <div class="card-content">
                <span class="card-title titulo-seccion"><i class="material-icons left">menu_book</i> Detalle de la receta</span>
                <div id="detalle"></div>
            </div>
        </div>

    </main>

    <footer class="page-footer">
        <div class="footer-copyright">
            <div class="container">Trabajo Practico 4 - Ejercicio 3 - PERALTA Damaris, SEIBEL Micaela</div>
        </div>
    </footer>

    <script src="materialize.min.js"></script>
    <script src="javascript.js"></script>
</body>

</html>
