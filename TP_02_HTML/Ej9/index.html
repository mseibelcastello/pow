<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <table border="1">
        <caption> <h1> Redes Sociales</h1> </caption>

        <tr>
            <td colspan="2"><b>Nombre</b></td>
            <td><b>¿Tengo cuenta?</b></td>
            <td><b>Valoración</b></td>
            <td><b>Dirección</b></td>
        </tr>

        <!-- Facebook --> 
        <tr>
            <td rowspan="2"><b>Facebook</b></td>
            <td rowspan="2"><img src="res/logo-fb.JPG" alt="logo fb" height="100"></td>
            <td rowspan="2"><input type="checkbox"></td>
            <td><img src="res/valoracionfb.JPG" alt="valoracion" height="40"></td>


            <td rowspan="2"> <a href="http://www.facebook.com">http://www.facebook.com</a></td>
        </tr>
        <tr>
            <td>2.5/5</td>
        </tr>

        <!-- Flickr --> 
        <tr>
            <td rowspan="2"><b>Flickr</b></td>
            <td rowspan="2"><img src="res/logo-flickr.JPG" alt="logo flickr" height="100" ></td>
            <td rowspan="2"><input type="checkbox"></td>

            <td><img src="res/valoracionflckr.JPG" alt="valoracion" height="40"></td>

            
            <td rowspan="2"> <a href="http://www.flickr.com">http://www.flickr.com</a></td>
        </tr>
        <tr>
            <td>4.2/5</td>
        </tr>

        <!-- Vimeo --> 
        <tr>
            <td rowspan="2"><b>Vimeo</b></td>
            <td rowspan="2"><img src="res/logo-vimeo.JPG" alt="logo vimeo" height="100"></td>
            <td rowspan="2"><input type="checkbox"></td>
            <td><img src="res/valoracionvimeo.JPG" alt="valoracion" height="40"></td>
            <td rowspan="2"> <a href="http://www.vimeo.com">http://www.vimeo.com</a></td>
        </tr>
        <tr>
            <td>Sin valoraciones</td>
        </tr>

        <!-- Youtube --> 
        <tr>
            <td rowspan="2"><b>Youtube</b></td>
            <td rowspan="2"><img src="res/logo-yt.JPG" alt="logo youtube" height="100"></td>
            <td rowspan="2"><input type="checkbox"></td>
            <td><img src="res/valoracionyoutube.JPG" alt="valoracion" height="40"></td>
            <td rowspan="2"> <a href="http://www.youtube.com">http://www.youtube.com</a></td>
        </tr>
        <tr>
            <td>2.75/5</td>
        </tr>


    </table>

    
</body>
</html>
